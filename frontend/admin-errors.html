<!DOCTYPE html>
<html>
<head>
    <title>Error Monitor - CloudOptima Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f0f2f5; display: flex; }
        
        .sidebar {
            width: 250px; background: #1a1c2e; color: white; padding: 20px; height: 100vh;
            position: fixed;
        }
        .main-content { margin-left: 250px; padding: 20px; width: 100%; }
        
        .nav-link {
            display: block; padding: 12px; color: #a0a8c0; text-decoration: none; border-radius: 8px;
            margin: 5px 0;
        }
        .nav-link:hover, .nav-link.active { background: #2d2f3f; color: white; }
        
        .top-bar {
            background: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px;
            display: flex; justify-content: space-between;
        }
        
        .error-stats {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px;
        }
        .error-card {
            background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .error-card.critical { border-left: 4px solid #dc2626; }
        .error-card.warning { border-left: 4px solid #f59e0b; }
        
        .error-item {
            background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px;
            border-left: 4px solid #ef4444;
            display: flex; justify-content: space-between;
            cursor: pointer;
        }
        .error-item:hover { background: #f8f9fa; }
        .error-time { color: #666; font-size: 0.9em; }
        .error-msg { font-weight: 600; margin: 5px 0; }
        .error-count { background: #ef4444; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        
        .resolve-btn {
            background: #10b981; color: white; border: none; padding: 5px 15px;
            border-radius: 6px; cursor: pointer;
        }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 10px; width: 500px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3 style="margin-bottom: 30px;">Cloud<span style="color: #667eea;">Optima</span></h3>
        <a href="admin-dashboard.html" class="nav-link">📊 Dashboard</a>
        <a href="admin-users.html" class="nav-link">👥 Users</a>
        <a href="admin-logs.html" class="nav-link">📋 Logs</a>
        <a href="admin-errors.html" class="nav-link active">⚠️ Errors</a>
        <a href="admin-settings.html" class="nav-link">⚙️ Settings</a>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h2>Error Monitoring</h2>
            <div>
                <span id="adminDisplay">Admin</span>
                <button onclick="logout()" style="margin-left: 15px; padding: 5px 10px;">Logout</button>
            </div>
        </div>

        <div class="error-stats">
            <div class="error-card critical">
                <div style="font-size:28px; font-weight:700;" id="criticalCount">0</div>
                <div>Critical Errors</div>
            </div>
            <div class="error-card warning">
                <div style="font-size:28px; font-weight:700;" id="warningCount">0</div>
                <div>Warnings</div>
            </div>
            <div class="error-card">
                <div style="font-size:28px; font-weight:700;" id="resolvedCount">0</div>
                <div>Resolved</div>
            </div>
        </div>

        <div style="margin-bottom: 15px; display: flex; gap: 10px;">
            <select id="errorFilter" style="padding:8px;">
                <option value="all">All Errors</option>
                <option value="critical">Critical</option>
                <option value="warning">Warnings</option>
                <option value="api">API Errors</option>
                <option value="db">Database</option>
            </select>
            <button onclick="refreshErrors()" style="padding:8px 15px;">🔄 Refresh</button>
        </div>

        <div id="errorsList"></div>

        <!-- Error Detail Modal -->
        <div class="modal" id="errorModal">
            <div class="modal-content">
                <h3 id="errorModalTitle">Error Details</h3>
                <div id="errorDetails" style="margin:20px 0;"></div>
                <div style="text-align:right;">
                    <button onclick="closeErrorModal()" style="padding:8px 15px;">Close</button>
                    <button onclick="resolveError()" class="resolve-btn" style="margin-left:10px;">Mark Resolved</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let errors = [];

        // Generate sample errors
        function generateErrors() {
            errors = [
                {id:1, type:'critical', message:'Database connection timeout', time:'2026-02-28 10:23', count:5, status:'open'},
                {id:2, type:'warning', message:'API rate limit approaching 80%', time:'2026-02-28 09:15', count:2, status:'open'},
                {id:3, type:'critical', message:'AWS credentials expiring in 3 days', time:'2026-02-28 08:30', count:1, status:'open'},
                {id:4, type:'warning', message:'High CPU usage on main server', time:'2026-02-27 23:45', count:8, status:'open'},
                {id:5, type:'api', message:'Brevo email API timeout', time:'2026-02-27 22:10', count:12, status:'resolved'}
            ];
            displayErrors();
            updateStats();
        }

        function displayErrors() {
            const filter = document.getElementById('errorFilter').value;
            const filtered = filter === 'all' ? errors : errors.filter(e => e.type === filter);
            
            const list = document.getElementById('errorsList');
            if (filtered.length === 0) {
                list.innerHTML = '<div style="background:white; padding:40px; text-align:center; border-radius:10px;">No errors found</div>';
                return;
            }
            
            list.innerHTML = filtered.map(e => `
                <div class="error-item" onclick="showErrorDetail(${e.id})">
                    <div style="flex:1">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="error-msg">${e.message}</span>
                            <span class="error-count">${e.count}</span>
                        </div>
                        <span class="error-time">${e.time}</span>
                    </div>
                    ${e.status === 'open' ? 
                        '<button class="resolve-btn" onclick="event.stopPropagation(); resolveError(${e.id})">Resolve</button>' : 
                        '<span style="color:#10b981;">✓ Resolved</span>'}
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('criticalCount').textContent = errors.filter(e => e.type === 'critical' && e.status === 'open').length;
            document.getElementById('warningCount').textContent = errors.filter(e => e.type === 'warning' && e.status === 'open').length;
            document.getElementById('resolvedCount').textContent = errors.filter(e => e.status === 'resolved').length;
        }

        function showErrorDetail(id) {
            const error = errors.find(e => e.id === id);
            if (error) {
                document.getElementById('errorDetails').innerHTML = `
                    <p><strong>Type:</strong> ${error.type}</p>
                    <p><strong>Message:</strong> ${error.message}</p>
                    <p><strong>Time:</strong> ${error.time}</p>
                    <p><strong>Occurrences:</strong> ${error.count}</p>
                    <p><strong>Status:</strong> ${error.status}</p>
                    <p><strong>Stack Trace:</strong><br>Error at ${error.message} (simulated trace)</p>
                `;
                document.getElementById('errorModal').style.display = 'flex';
            }
        }

        function closeErrorModal() {
            document.getElementById('errorModal').style.display = 'none';
        }

        function resolveError(id) {
            const error = errors.find(e => e.id === id);
            if (error) {
                error.status = 'resolved';
                displayErrors();
                updateStats();
                closeErrorModal();
            }
        }

        function refreshErrors() {
            displayErrors();
        }

        function logout() {
            localStorage.removeItem('adminUser');
            window.location.href = 'admin-login.html';
        }

        document.getElementById('errorFilter').addEventListener('change', displayErrors);
        generateErrors();
    </script>
</body>
</html>
