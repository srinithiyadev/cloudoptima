<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudOptima - Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .signup-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 450px;
            padding: 40px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo i {
            font-size: 48px;
            color: #4f46e5;
            background: #eef2ff;
            padding: 15px;
            border-radius: 16px;
        }
        .logo h2 {
            margin-top: 15px;
            color: #1e293b;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-weight: 500;
        }
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            color: #94a3b8;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
        }
        .input-group input:focus {
            border-color: #4f46e5;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover {
            background: #4338ca;
        }
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .links {
            margin-top: 25px;
            text-align: center;
        }
        .links a {
            color: #4f46e5;
            text-decoration: none;
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fee2e2;
            display: block;
        }
        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #dcfce7;
            display: block;
        }
        .terms {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <i class="fas fa-cloud"></i>
            <h2>CloudOptima</h2>
            <p style="color: #64748b; margin-top: 5px;">Create your account</p>
        </div>

        <div id="alertMessage" class="alert"></div>

        <form id="signupForm">
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="fullName" placeholder="Enter your name" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Create password" required>
                </div>
            </div>
            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label>I agree to Terms & Conditions</label>
            </div>
            <button type="submit" class="btn" id="signupBtn">Create Account</button>
        </form>

        <div class="links">
            <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>

    <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const terms = document.getElementById('terms').checked;
        const alertDiv = document.getElementById('alertMessage');
        const signupBtn = document.getElementById('signupBtn');

        if (!terms) {
            alertDiv.className = 'alert alert-error';
            alertDiv.innerHTML = 'Please accept Terms & Conditions';
            return;
        }

        if (password.length < 6) {
            alertDiv.className = 'alert alert-error';
            alertDiv.innerHTML = 'Password must be at least 6 characters';
            return;
        }

        // Get existing users
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        
        // Check if email exists
        if (users.some(u => u.email === email)) {
            alertDiv.className = 'alert alert-error';
            alertDiv.innerHTML = 'Email already registered';
            return;
        }
        
        // Add new user
        users.push({
            id: Date.now(),
            name: name,
            email: email,
            password: password,
            created: new Date().toISOString()
        });
        
        localStorage.setItem('users', JSON.stringify(users));
        
        alertDiv.className = 'alert alert-success';
        alertDiv.innerHTML = 'Account created! Redirecting to login...';
        
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 2000);
    });
    </script>
</body>
</html>
