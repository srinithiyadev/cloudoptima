<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CloudOptima</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
        }

        .logo span {
            color: #667eea;
            font-weight: 700;
        }

        .badge {
            background: #ff4757;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .password-input {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            display: block;
        }

        .alert-success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #bbf7d0;
            display: block;
        }

        .security-note {
            margin-top: 20px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }

        .security-note i {
            color: #667eea;
            margin-right: 5px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Cloud<span>Optima</span></h1>
            <div class="badge">Admin Portal</div>
        </div>

        <div id="alertMessage" class="alert"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="email" placeholder="admin@cloudoptima.com" required>
            </div>

            <div class="form-group">
                <label>Admin Password</label>
                <div class="password-input">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <span class="toggle-password" onclick="togglePassword()">👁️</span>
                </div>
            </div>

            <div class="form-group">
                <label>2FA Code (Optional)</label>
                <input type="text" id="twofa" placeholder="Enter 6-digit code">
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span>Secure Login</span>
            </button>
        </form>

        <div class="security-note">
            <i>🔒</i> This area is restricted to administrators only. All access is logged.
        </div>

        <div class="back-link">
            <a href="index.html">← Return to main site</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById('password');
            password.type = password.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const twofa = document.getElementById('twofa').value;
            const alertDiv = document.getElementById('alertMessage');
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>Authenticating...</span>';

            // Check admin credentials (in production, use real backend)
            if (email === 'admin@cloudoptima.com' && password === 'Admin@2026') {
                // Set admin session
                localStorage.setItem('adminUser', JSON.stringify({
                    email: email,
                    role: 'super_admin',
                    loggedIn: true,
                    loginTime: new Date().toISOString()
                }));

                alertDiv.className = 'alert alert-success';
                alertDiv.innerHTML = '✓ Authentication successful! Redirecting...';

                // Log admin login
                fetch('https://cloudoptima-api.onrender.com/api/admin/logs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'admin_login',
                        email: email,
                        timestamp: new Date().toISOString()
                    })
                }).catch(() => {});

                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 1000);
            } else {
                alertDiv.className = 'alert alert-error';
                alertDiv.innerHTML = '✗ Invalid admin credentials';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>Secure Login</span>';
            }
        });
    </script>
</body>
</html>
