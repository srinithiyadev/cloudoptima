<!DOCTYPE html>
<html>
<head>
    <title>Activity Logs - CloudOptima Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f0f2f5; display: flex; }
        
        .sidebar {
            width: 250px; background: #1a1c2e; color: white; padding: 20px; height: 100vh;
            position: fixed;
        }
        .main-content { margin-left: 250px; padding: 20px; width: 100%; }
        
        .nav-link {
            display: block; padding: 12px; color: #a0a8c0; text-decoration: none; border-radius: 8px;
            margin: 5px 0;
        }
        .nav-link:hover, .nav-link.active { background: #2d2f3f; color: white; }
        
        .top-bar {
            background: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px;
            display: flex; justify-content: space-between;
        }
        
        .filters {
            background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px;
            display: flex; gap: 10px;
        }
        .filters select, .filters input {
            padding: 8px; border: 1px solid #ddd; border-radius: 6px;
        }
        
        .log-entry {
            background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px;
            border-left: 4px solid #667eea;
            display: flex; justify-content: space-between;
        }
        .log-time { color: #666; font-size: 0.9em; }
        .log-user { font-weight: 600; color: #333; }
        .log-action { margin: 5px 0; color: #555; }
        
        .pagination {
            display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;
        }
        .page-btn {
            padding: 8px 12px; border: 1px solid #ddd; background: white; border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3 style="margin-bottom: 30px;">Cloud<span style="color: #667eea;">Optima</span></h3>
        <a href="admin-dashboard.html" class="nav-link">📊 Dashboard</a>
        <a href="admin-users.html" class="nav-link">👥 Users</a>
        <a href="admin-logs.html" class="nav-link active">📋 Logs</a>
        <a href="admin-errors.html" class="nav-link">⚠️ Errors</a>
        <a href="admin-settings.html" class="nav-link">⚙️ Settings</a>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h2>Activity Logs</h2>
            <div>
                <span id="adminDisplay">Admin</span>
                <button onclick="logout()" style="margin-left: 15px; padding: 5px 10px;">Logout</button>
            </div>
        </div>

        <div class="filters">
            <select id="actionFilter" onchange="filterLogs()">
                <option value="all">All Actions</option>
                <option value="login">Login</option>
                <option value="logout">Logout</option>
                <option value="settings">Settings</option>
                <option value="alert">Alert</option>
            </select>
            <select id="userFilter" onchange="filterLogs()">
                <option value="all">All Users</option>
            </select>
            <input type="date" id="dateFilter" onchange="filterLogs()">
            <button class="btn" style="background:#667eea; color:white; border:none; padding:8px 15px;" onclick="exportLogs()">Export</button>
        </div>

        <div id="logsContainer">
            <div class="log-entry">
                <div>
                    <span class="log-user">Loading logs...</span>
                </div>
            </div>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        let logs = [];
        let currentPage = 1;
        const perPage = 10;

        // Generate sample logs
        function generateLogs() {
            const actions = ['login', 'logout', 'settings_update', 'alert_triggered', 'report_generated'];
            const users = ['john@example.com', 'jane@example.com', 'admin@cloudoptima.com', 'mike@example.com'];
            
            for (let i = 1; i <= 50; i++) {
                const date = new Date();
                date.setHours(date.getHours() - i);
                logs.push({
                    id: i,
                    timestamp: date.toISOString(),
                    user: users[Math.floor(Math.random() * users.length)],
                    action: actions[Math.floor(Math.random() * actions.length)],
                    details: `Action performed on resource ${Math.floor(Math.random() * 100)}`,
                    ip: `192.168.1.${Math.floor(Math.random() * 255)}`
                });
            }
        }

        function displayLogs() {
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const pageLogs = logs.slice(start, end);
            
            const container = document.getElementById('logsContainer');
            container.innerHTML = pageLogs.map(log => `
                <div class="log-entry">
                    <div style="flex:1">
                        <span class="log-user">${log.user}</span>
                        <div class="log-action">${log.action.replace('_', ' ')} - ${log.details}</div>
                        <span class="log-time">${new Date(log.timestamp).toLocaleString()}</span>
                    </div>
                    <div style="color:#666; font-size:0.8em;">${log.ip}</div>
                </div>
            `).join('');
            
            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(logs.length / perPage);
            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            document.getElementById('pagination').innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            displayLogs();
        }

        function filterLogs() {
            // Simple filter simulation
            displayLogs();
        }

        function exportLogs() {
            alert('Exporting logs...');
        }

        function logout() {
            localStorage.removeItem('adminUser');
            window.location.href = 'admin-login.html';
        }

        // Initialize
        generateLogs();
        displayLogs();
    </script>
</body>
</html>
