<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: #f1f5f9;
        }
        .admin-header {
            background: #0f172a;
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .main-content {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 24px;
        }
        .user-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .user-info h3 {
            color: #0f172a;
        }
        .user-info p {
            color: #64748b;
            margin-top: 5px;
        }
        .user-actions button {
            padding: 8px 16px;
            margin-left: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-view { background: #3b82f6; color: white; }
        .btn-disable { background: #f59e0b; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
        }
        .back-link {
            margin-bottom: 20px;
        }
        .back-link a {
            color: #3b82f6;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <h2><i class="fas fa-users-cog"></i> User Management</h2>
        <button onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 8px 20px; border-radius: 8px;">Logout</button>
    </div>

    <div class="main-content">
        <div class="back-link">
            <a href="admin-dashboard.html">← Back to Dashboard</a>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search users by email...">
            <button onclick="searchUsers()" style="background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px;">Search</button>
        </div>

        <div id="usersList">
            <!-- Users will be listed here -->
        </div>
    </div>

    <script>
        const users = [
            { email: 'alice@example.com', name: 'Alice', joined: '2026-02-15', status: 'active', clouds: ['AWS'] },
            { email: 'bob@example.com', name: 'Bob', joined: '2026-02-14', status: 'active', clouds: ['AWS', 'Azure'] },
            { email: 'charlie@example.com', name: 'Charlie', joined: '2026-02-10', status: 'inactive', clouds: [] },
            { email: 'david@example.com', name: 'David', joined: '2026-02-17', status: 'active', clouds: ['GCP'] },
            { email: 'eve@example.com', name: 'Eve', joined: '2026-02-16', status: 'active', clouds: ['AWS', 'GCP'] }
        ];

        function displayUsers(filteredUsers = users) {
            const container = document.getElementById('usersList');
            container.innerHTML = '';
            
            filteredUsers.forEach(user => {
                container.innerHTML += `
                    <div class="user-card">
                        <div class="user-info">
                            <h3>${user.email}</h3>
                            <p>Joined: ${user.joined} · Status: ${user.status} · Connected: ${user.clouds.join(', ') || 'None'}</p>
                        </div>
                        <div class="user-actions">
                            <button class="btn-view" onclick="viewUser('${user.email}')"><i class="fas fa-eye"></i> View</button>
                            <button class="btn-disable" onclick="toggleUser('${user.email}')"><i class="fas fa-ban"></i> Disable</button>
                            <button class="btn-delete" onclick="deleteUser('${user.email}')"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        function searchUsers() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = users.filter(u => u.email.toLowerCase().includes(search));
            displayUsers(filtered);
        }

        function viewUser(email) {
            alert(`Viewing details for ${email}`);
        }

        function toggleUser(email) {
            alert(`Toggle user ${email} (demo)`);
        }

        function deleteUser(email) {
            if(confirm(`Delete ${email}?`)) {
                alert(`User ${email} deleted`);
            }
        }

        function logout() {
            localStorage.removeItem('admin_logged_in');
            window.location.replace('admin-login.html');
        }

        displayUsers();
    </script>
</body>
</html>
